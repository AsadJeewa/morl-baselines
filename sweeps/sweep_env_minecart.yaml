project: MORL-Baselines

program: sweep.py
method: grid

metric:
  name: eval/hypervolume
  goal: maximize

parameters:
  algo:
    value: envelope
  env:
    value: minecart

  total_timesteps:
    value: 500000

  learning_rate:
    values: [0.0001, 0.0002, 0.0003]

  gradient_updates:
    values: [2, 5]

  batch_size:
    values: [32, 64]

  tau:
    value: 0.1

  seed:
    values: [1, 2, 3]