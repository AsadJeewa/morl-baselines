project: MORL-Baselines

program: sweep.py

method: grid

metric:
  name: eval/hypervolume
  goal: maximize

parameters:
  algo:
    value: envelope

  env:
    value: dst

  total_timesteps:
    value: 200000

  learning_rate:
    values: [0.0002, 0.0003, 0.0004]

  gradient_updates:
    values: [1, 2, 4]

  initial_epsilon:
    values: [0.3, 0.5, 0.7]

  final_epsilon:
    value: 0.01

  epsilon_decay_fraction:
    value: 0.6

  batch_size:
    value: 256

  tau:
    value: 1.0

  seed:
    values: [1, 2]