project: MORL-Baselines

program: sweep.py

method: grid

metric:
  name: eval/hypervolume
  goal: maximize

parameters:
  algo:
    value: gpi

  env:
    value: dst

  total_timesteps:
    value: 150000

  learning_rate:
    values: [0.0002, 0.0003]

  gradient_updates:
    values: [4, 8]

  final_epsilon:
    values: [0.01, 0.05]

  seed:
    values: [1, 2]