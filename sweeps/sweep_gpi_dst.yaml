project: MORL-Baselines

program: sweep.py

method: grid

metric:
  name: eval/hypervolume
  goal: maximize

parameters:

  algo:
    value: gpi

  env:
    value: dst

  total_timesteps:
    value: 400000

  learning_rate:
    values: [0.0003, 0.001, 0.003]

  gradient_updates:
    values: [8, 20]

  seed:
    values: [1, 2]